<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Finance Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Боковая панель в стиле Spotify */
        .sidebar {
            width: 240px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #1db954;
            margin-bottom: 32px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-links li a {
            color: #b3b3b3;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-links li a:hover, .nav-links li a.active {
            color: #ffffff;
        }
        /* Основная область контента */
        .main-content {
            flex: 1;
            background: linear-gradient(180deg, #202020 0%, #121212 100%);
            padding: 32px;
            overflow-y: auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 24px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #181818;
            padding: 20px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .card:hover {
            background-color: #282828;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #b3b3b3;
        }
        .card .amount {
            font-size: 24px;
            font-weight: bold;
            color: #1db954;
        }
    </style>
</head>
<body>

<!-- Сайдбар -->
<div class="sidebar">
    <div class="logo">🎵 FinanceManager</div>
    <ul class="nav-links">
        <li><a class="active" onclick="switchPage('dashboard', this)">Главная</a></li>
        <li><a onclick="switchPage('accounts', this)">Счета</a></li>
        <li><a onclick="switchPage('transactions', this)">Транзакции</a></li>
        <li><a onclick="switchPage('budget', this)">Бюджет</a></li>
    </ul>
</div>

<!-- Контент -->
<div class="main-content">
    <h1 id="page-title">Главная</h1>
    <div id="page-content">
        <div class="card-grid">
            <div class="card">
                <h3>Общий баланс</h3>
                <div class="amount"id="balance-val">Загрузка..</div>
            </div>
            <div class="card">
                <h3>Расходы за месяц</h3>
                <div class="amount"  id="expenses-val" style="color: #e91429;">Загрузка..</div>
            </div>
            <div class="card">
            <h3>Доход за месяц</h3>
            <div class="amount" id="incomes-val" style = "color: #00FF00;">Загрузка..</div>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
